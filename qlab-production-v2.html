<style>
/* ===== PRODUCTION DASHBOARD v2 ===== */
.prod-dashboard {
  background: var(--color-bg, #f8f7f4);
  padding: 60px 0;
}
.prod-dashboard-container {
  max-width: 1200px; margin: 0 auto; padding: 0 24px;
}
.prod-header {
  display: flex; justify-content: space-between; align-items: flex-end;
  flex-wrap: wrap; gap: 20px; margin-bottom: 32px;
}
.prod-header h2 {
  font-family: var(--font-heading, Georgia, serif); font-size: 1.8rem;
  color: var(--color-primary, #1f1f1f); font-weight: 400;
}
.prod-header p {
  color: var(--color-text-secondary, #5a5a5a); font-size: 0.95rem;
  max-width: 500px; margin-top: 6px;
}
.prod-legend {
  display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
}
.prod-legend-item {
  display: flex; align-items: center; gap: 6px; font-size: 0.8rem;
  color: var(--color-text-secondary, #5a5a5a);
}
.prod-legend-dot {
  width: 12px; height: 12px; border-radius: 50%; display: inline-block;
}
.dot-fresh { background: #a8d5ba; border: 2px solid #7bc093; }
.dot-best  { background: #e8d5b5; border: 2px solid #c8a97e; }
.dot-mature{ background: #c4a882; border: 2px solid #a08060; }

/* Summary Cards */
.prod-summary {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
  margin-bottom: 32px;
}
@media (max-width: 768px) {
  .prod-summary { grid-template-columns: repeat(2, 1fr); }
}
.prod-summary-card {
  background: var(--color-card, #fff); border-radius: var(--radius, 8px);
  padding: 20px; border: 1px solid var(--color-border, #e8e6e1);
  text-align: center; transition: all 0.2s;
}
.prod-summary-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md, 0 4px 12px rgba(0,0,0,0.06)); }
.prod-summary-card .num {
  font-family: var(--font-heading, Georgia, serif); font-size: 2rem;
  color: var(--color-primary, #1f1f1f); line-height: 1;
}
.prod-summary-card .label {
  font-size: 0.75rem; color: var(--color-text-muted, #8a8a8a);
  margin-top: 6px; text-transform: uppercase; letter-spacing: 0.04em;
}

/* Calendar Grid */
.prod-calendar {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}
.prod-day {
  background: var(--color-card, #fff); border-radius: var(--radius-lg, 16px);
  border: 1px solid var(--color-border, #e8e6e1); overflow: hidden;
  transition: all 0.3s; position: relative;
}
.prod-day:hover { box-shadow: var(--shadow-md, 0 4px 12px rgba(0,0,0,0.06)); transform: translateY(-2px); }

/* Cluster color top border */
.prod-day.fresh { border-top: 4px solid #7bc093; }
.prod-day.best   { border-top: 4px solid #c8a97e; }
.prod-day.mature { border-top: 4px solid #a08060; }

.prod-day-header {
  padding: 16px 20px 12px; border-bottom: 1px solid var(--color-border, #e8e6e1);
  display: flex; justify-content: space-between; align-items: center;
}
.prod-day-date {
  font-family: var(--font-heading, Georgia, serif); font-size: 1.1rem;
  color: var(--color-primary, #1f1f1f);
}
.prod-day-badge {
  font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 100px;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.badge-fresh { background: #e8f5e9; color: #2e7d32; }
.badge-best  { background: #fff8e1; color: #8a6d3b; }
.badge-mature{ background: #efebe9; color: #5d4037; }

.prod-day-age {
  font-size: 0.75rem; color: var(--color-text-muted, #8a8a8a); margin-top: 2px;
}

.prod-day-body { padding: 16px 20px; }
.prod-section-title {
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--color-text-muted, #8a8a8a);
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}

/* RB & HB Items */
.prod-item {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 10px 12px; background: var(--color-bg-warm, #f0efe9);
  border-radius: var(--radius, 8px); margin-bottom: 8px;
  border: 1px solid var(--color-border, #e8e6e1); transition: all 0.2s;
}
.prod-item:hover { background: #e8e4da; }
.prod-item-name {
  font-size: 0.85rem; font-weight: 600; color: var(--color-primary, #1f1f1f);
  line-height: 1.3;
}
.prod-item-batch {
  font-size: 0.7rem; color: var(--color-text-muted, #8a8a8a); margin-top: 3px;
  font-family: monospace;
}
.prod-item-meta {
  font-size: 0.75rem; color: var(--color-text-muted, #8a8a8a); margin-top: 3px;
}
.prod-item-qty {
  font-size: 0.8rem; font-weight: 700; color: var(--color-accent, #c8a97e);
  white-space: nowrap; text-align: right;
}
.prod-item-qty span {
  font-size: 0.65rem; font-weight: 400; color: var(--color-text-muted, #8a8a8a);
  display: block;
}

/* Stock Panel */
.prod-stock-panel {
  background: var(--color-card, #fff); border-radius: var(--radius-lg, 16px);
  border: 1px solid var(--color-border, #e8e6e1); padding: 24px;
  margin-top: 32px;
}
.prod-stock-panel h3 {
  font-family: var(--font-heading, Georgia, serif); font-size: 1.2rem;
  margin-bottom: 16px; color: var(--color-primary, #1f1f1f);
}
.prod-stock-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
}
@media (max-width: 768px) {
  .prod-stock-grid { grid-template-columns: 1fr; }
}
.prod-stock-col h4 {
  font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--color-text-muted, #8a8a8a);
  margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--color-border, #e8e6e1);
}
.prod-stock-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0; font-size: 0.85rem;
  border-bottom: 1px dashed var(--color-border, #e8e6e1);
}
.prod-stock-row:last-child { border-bottom: none; }
.prod-stock-name { color: var(--color-text-secondary, #5a5a5a); }
.prod-stock-qty { font-weight: 600; color: var(--color-primary, #1f1f1f); }

/* Loading & Error */
.prod-loading {
  text-align: center; padding: 60px 20px; color: var(--color-text-muted, #8a8a8a);
}
.prod-loading-spinner {
  width: 40px; height: 40px; border: 3px solid var(--color-border, #e8e6e1);
  border-top-color: var(--color-accent, #c8a97e); border-radius: 50%;
  animation: spin 1s linear infinite; margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.prod-error {
  background: #ffebee; border: 1px solid #ef9a9a; border-radius: var(--radius, 8px);
  padding: 20px; color: #c62828; text-align: center; margin: 20px 0;
}
.prod-empty {
  text-align: center; padding: 60px 20px; color: var(--color-text-muted, #8a8a8a);
}

/* Refresh Button */
.prod-refresh {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; background: var(--color-bg-warm, #f0efe9);
  border: 1px solid var(--color-border, #e8e6e1); border-radius: var(--radius, 8px);
  font-size: 0.8rem; font-weight: 600; color: var(--color-text-secondary, #5a5a5a);
  cursor: pointer; transition: all 0.2s;
}
.prod-refresh:hover { background: var(--color-accent-light, #e8d5b5); color: var(--color-primary, #1f1f1f); }
</style>

          <div class="prod-legend-item"><span class="prod-legend-dot dot-mature"></span> <span data-id="Matured (14–30 hari)" data-en="Matured (14–30 days)">Matured (14–30 days)</span></div>

<script>
// ============================================================
// PRODUCTION DASHBOARD v2 — FRONTEND
// Sesuai struktur: Assembly (batch_no) & Stock (sisa)
// ============================================================

const PROD_API_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec?action=getProduction';
// Ganti YOUR_DEPLOYMENT_ID dengan ID deployment Web App GAS Anda

let prodDataCache = null;

function productionInit() {
  productionFetch();
}

function productionRefresh() {
  prodDataCache = null;
  productionFetch();
}

function productionFetch() {
  const container = document.getElementById('prodCalendar');
  container.innerHTML = `
    <div class="prod-loading">
      <div class="prod-loading-spinner"></div>
      <p>${currentLang === 'id' ? 'Memuat data produksi...' : 'Loading production data...'}</p>
    </div>
  `;

  // Gunakan JSONP untuk bypass CORS
  const script = document.createElement('script');
  const callbackName = 'prodCb_' + Date.now();

  window[callbackName] = function(data) {
    prodDataCache = data;
    productionRender(data);
    delete window[callbackName];
    if (script.parentNode) script.parentNode.removeChild(script);
  };

  script.src = PROD_API_URL + '&callback=' + callbackName;
  script.onerror = function() {
    container.innerHTML = `
      <div class="prod-error">
        <strong>${currentLang === 'id' ? 'Gagal memuat data' : 'Failed to load data'}</strong><br>
        ${currentLang === 'id' 
          ? 'Pastikan URL GAS sudah benar dan Web App di-deploy. Cek console untuk detail.' 
          : 'Ensure GAS URL is correct and Web App is deployed. Check console for details.'}
      </div>
    `;
    delete window[callbackName];
  };

  document.head.appendChild(script);

  // Fallback: tampilkan mock data setelah 10 detik jika GAS belum terhubung
  setTimeout(() => {
    if (!prodDataCache && container.querySelector('.prod-loading')) {
      productionRenderMock();
    }
  }, 10000);
}

function productionRender(data) {
  if (!data || !data.success) {
    productionRenderError(data && data.error ? data.error : 'Unknown error');
    return;
  }

  // Update summary
  document.getElementById('sumTotalRB').textContent = data.summary.totalRB || 0;
  document.getElementById('sumTotalHB').textContent = data.summary.totalHB || 0;
  document.getElementById('sumBest').textContent = data.summary.best || 0;
  document.getElementById('sumMatured').textContent = data.summary.matured || 0;

  // Render calendar
  const container = document.getElementById('prodCalendar');
  const calendar = data.calendar || [];

  if (calendar.length === 0) {
    container.innerHTML = `
      <div class="prod-empty">
        <div style="font-size:3rem; margin-bottom:12px;">☕</div>
        <p>${currentLang === 'id' ? 'Tidak ada produksi dalam 30 hari terakhir.' : 'No production in the last 30 days.'}</p>
      </div>
    `;
  } else {
    container.innerHTML = '<div class="prod-calendar">' + calendar.map(day => productionDayCard(day)).join('') + '</div>';
  }

  // Render stock
  productionRenderStock(data.stock);
}

function productionDayCard(day) {
  const clusterClass = day.cluster;
  const badgeClass = 'badge-' + day.cluster;
  const ageText = currentLang === 'id' 
    ? (day.ageDays === 0 ? 'Hari ini' : day.ageDays + ' hari yang lalu')
    : (day.ageDays === 0 ? 'Today' : day.ageDays + ' days ago');

  let rbHtml = '';
  if (day.rb && day.rb.length > 0) {
    rbHtml = `
      <div class="prod-section-title">☕ ${currentLang === 'id' ? 'Roasted Beans (RB)' : 'Roasted Beans (RB)'}</div>
      ${day.rb.map(item => `
        <div class="prod-item">
          <div>
            <div class="prod-item-name">${escapeHtml(item.name)}</div>
            <div class="prod-item-batch">${escapeHtml(item.batchNo)}</div>
            ${item.rawMaterial ? `<div class="prod-item-meta">${currentLang === 'id' ? 'Bahan: ' : 'Material: '}${escapeHtml(item.rawMaterial)}</div>` : ''}
          </div>
          <div class="prod-item-qty">${item.weight || 0}<span>kg</span></div>
        </div>
      `).join('')}
    `;
  }

  let hbHtml = '';
  if (day.hb && day.hb.length > 0) {
    hbHtml = `
      <div class="prod-section-title" style="margin-top:12px;">🫘 ${currentLang === 'id' ? 'Houseblend (HB)' : 'Houseblend (HB)'}</div>
      ${day.hb.map(item => `
        <div class="prod-item">
          <div>
            <div class="prod-item-name">${escapeHtml(item.name)}</div>
            <div class="prod-item-batch">${escapeHtml(item.batchNo)}</div>
            ${item.rawMaterial ? `<div class="prod-item-meta">${currentLang === 'id' ? 'Bahan: ' : 'Material: '}${escapeHtml(item.rawMaterial)}</div>` : ''}
          </div>
          <div class="prod-item-qty">${item.weight || 0}<span>kg</span></div>
        </div>
      `).join('')}
    `;
  }

  return `
    <div class="prod-day ${clusterClass}">
      <div class="prod-day-header">
        <div>
          <div class="prod-day-date">${day.dateDisplay}</div>
          <div class="prod-day-age">${ageText}</div>
        </div>
        <span class="prod-day-badge ${badgeClass}">${day.clusterLabel}</span>
      </div>
      <div class="prod-day-body">
        ${rbHtml}
        ${hbHtml}
      </div>
    </div>
  `;
}

function productionRenderStock(stock) {
  if (!stock) return;
  const panel = document.getElementById('prodStockPanel');
  const grid = document.getElementById('prodStockGrid');

  const hasStock = (stock.rb && stock.rb.length > 0) || 
                   (stock.hb && stock.hb.length > 0) || 
                   (stock.gb && stock.gb.length > 0);

  if (!hasStock) {
    panel.style.display = 'none';
    return;
  }

  panel.style.display = 'block';

  const cols = [];

  if (stock.rb && stock.rb.length > 0) {
    cols.push(`
      <div class="prod-stock-col">
        <h4>☕ Roasted Beans (RB)</h4>
        ${stock.rb.map(s => `
          <div class="prod-stock-row">
            <span class="prod-stock-name">${escapeHtml(s.name)}</span>
            <span class="prod-stock-qty">${s.sisa} kg</span>
          </div>
        `).join('')}
      </div>
    `);
  }

  if (stock.hb && stock.hb.length > 0) {
    cols.push(`
      <div class="prod-stock-col">
        <h4>🫘 Houseblend (HB)</h4>
        ${stock.hb.map(s => `
          <div class="prod-stock-row">
            <span class="prod-stock-name">${escapeHtml(s.name)}</span>
            <span class="prod-stock-qty">${s.sisa} kg</span>
          </div>
        `).join('')}
      </div>
    `);
  }

  if (stock.gb && stock.gb.length > 0) {
    cols.push(`
      <div class="prod-stock-col">
        <h4>🌿 Green Beans (GB)</h4>
        ${stock.gb.map(s => `
          <div class="prod-stock-row">
            <span class="prod-stock-name">${escapeHtml(s.name)}</span>
            <span class="prod-stock-qty">${s.sisa} kg</span>
          </div>
        `).join('')}
      </div>
    `);
  }

  grid.innerHTML = cols.join('');
}

function productionRenderError(msg) {
  const container = document.getElementById('prodCalendar');
  container.innerHTML = `
    <div class="prod-error">
      <strong>${currentLang === 'id' ? 'Error' : 'Error'}</strong><br>
      ${escapeHtml(msg)}<br><br>
      <button class="prod-refresh" onclick="productionRefresh()">
        <span>↻</span> ${currentLang === 'id' ? 'Coba Lagi' : 'Retry'}
      </button>
    </div>
  `;
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Auto-init jika section ada di DOM
document.addEventListener('DOMContentLoaded', () => {
  if (document.getElementById('productionDashboard')) {
    productionInit();
  }
});
